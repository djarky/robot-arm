name: Create Release from Latest Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v1.0.0)"
        required: true
        type: string

      prerelease:
        description: "Mark as prerelease"
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Find latest successful build64.yml run on main
      # ============================================================
      - name: Find latest successful build
        id: build
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const response = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: "build64.yml",
              status: "success",
              branch: "main",
              per_page: 20
            });

            const runs = response.data.workflow_runs;

            if (runs.length === 0) {
              core.setFailed(
                "No successful build64.yml workflow runs were found on main."
              );
              return;
            }

            // GitHub returns runs ordered from newest to oldest.
            const latestRun = runs[0];

            console.log("==========================================");
            console.log("Latest successful build found");
            console.log("==========================================");
            console.log(`Run ID:    ${latestRun.id}`);
            console.log(`Commit:    ${latestRun.head_sha}`);
            console.log(`Branch:    ${latestRun.head_branch}`);
            console.log(`Created:   ${latestRun.created_at}`);
            console.log(`URL:       ${latestRun.html_url}`);
            console.log("==========================================");

            core.setOutput("run_id", latestRun.id);
            core.setOutput("sha", latestRun.head_sha);

      # ============================================================
      # 2. Find artifacts from that exact workflow run
      # ============================================================
      - name: Find build artifacts
        id: artifacts
        uses: actions/github-script@v7
        env:
          RUN_ID: ${{ steps.build.outputs.run_id }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const run_id = Number(process.env.RUN_ID);

            const response =
              await github.rest.actions.listWorkflowRunArtifacts({
                owner,
                repo,
                run_id,
                per_page: 100
              });

            const artifacts = response.data.artifacts
              .filter(a => !a.expired);

            console.log("Artifacts found:");

            for (const artifact of artifacts) {
              console.log(
                `- ${artifact.name} (${artifact.id})`
              );
            }

            const linux = artifacts.find(
              a => a.name === "linux-64bit"
            );

            const windows = artifacts.find(
              a => a.name === "windows-64bit"
            );

            if (!linux) {
              core.setFailed(
                `linux-64bit artifact not found in run ${run_id}`
              );
              return;
            }

            if (!windows) {
              core.setFailed(
                `windows-64bit artifact not found in run ${run_id}`
              );
              return;
            }

            console.log("");
            console.log("Selected artifacts:");
            console.log(`Linux:   ${linux.id}`);
            console.log(`Windows: ${windows.id}`);

            console.log("");
            console.log("Artifact sizes:");
            console.log(`Linux:   ${linux.size_in_bytes} bytes`);
            console.log(`Windows: ${windows.size_in_bytes} bytes`);

            core.setOutput("linux_id", linux.id);
            core.setOutput("windows_id", windows.id);

      # ============================================================
      # 3. Download COMPLETE Linux artifact
      #
      # IMPORTANT:
      # The artifact is NOT extracted.
      # The ZIP returned by GitHub is uploaded directly to the release.
      # ============================================================
      - name: Download complete Linux artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.artifacts.outputs.linux_id }}
        run: |
          echo "Downloading complete Linux artifact..."
          echo "Artifact ID: ${ARTIFACT_ID}"

          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o UrsinaArmSimulator-linux-x86_64.zip

          echo ""
          echo "Linux artifact downloaded:"
          ls -lh UrsinaArmSimulator-linux-x86_64.zip

      # ============================================================
      # 4. Download COMPLETE Windows artifact
      #
      # IMPORTANT:
      # The artifact is NOT extracted.
      # The ZIP returned by GitHub is uploaded directly to the release.
      # ============================================================
      - name: Download complete Windows artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.artifacts.outputs.windows_id }}
        run: |
          echo "Downloading complete Windows artifact..."
          echo "Artifact ID: ${ARTIFACT_ID}"

          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o UrsinaArmSimulator-windows-x86_64.zip

          echo ""
          echo "Windows artifact downloaded:"
          ls -lh UrsinaArmSimulator-windows-x86_64.zip

      # ============================================================
      # 5. Create GitHub Release
      # ============================================================
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: Ursina Arm Simulator ${{ inputs.version }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true

          files: |
            UrsinaArmSimulator-linux-x86_64.zip
            UrsinaArmSimulator-windows-x86_64.zip
