name: Unzip and commit robot_arm files

on:
  push:
    paths:
      - 'robot_arm_sha.zip'
  workflow_dispatch:

jobs:
  unzip-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (with LFS)
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Verify zip exists
        run: |
          if [ -f ./robot_arm_sha.zip ]; then
            echo "ZIP_FOUND=true" >> $GITHUB_ENV
          else
            echo "ZIP_FOUND=false" >> $GITHUB_ENV
          fi

      - name: Unzip robot_arm_sha.zip
        if: env.ZIP_FOUND == 'true'
        run: |
          rm -rf robot_arm || true
          mkdir -p robot_arm
          unzip -o robot_arm_sha.zip -d robot_arm
          ls -la robot_arm

      - name: Commit unzipped files back to repo
        if: env.ZIP_FOUND == 'true'
        env:
          GIT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_NAME: github-actions[bot]
        run: |
          git config user.email "$GIT_EMAIL"
          git config user.name "$GIT_NAME"
          git add -A robot_arm
          # exit if no changes
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add unzipped robot_arm files (from robot_arm_sha.zip) [skip ci]"
          # Push changes using the GITHUB_TOKEN provided by actions/checkout (persist-credentials=true by default)
          git push
